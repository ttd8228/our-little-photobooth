
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Little Photobooth ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="photobooth">

  <header class="top-header">
    <div class="brand">
      <h1>Our Little Photobooth</h1>
      <div class="brand-line"></div>
    </div>

    <div class="top-decoration">
      <div class="metal-knob"></div>
      <div class="speaker"><div></div></div>
    </div>
  </header>

  <main class="machine">

    <section class="camera-section">
      <div class="record-indicator">
        <span class="blue-led" id="statusLed"></span>
        <span>REC</span>
      </div>

      <div class="camera-frame">
        <div class="camera-inner">

          <div class="camera-top">
            <span class="record"><i></i> REC</span>
            <span id="photoCounter">0 / 4</span>
          </div>

          <div class="camera-screen">
            <video id="camera" autoplay muted playsinline></video>

            <div class="camera-placeholder" id="cameraPlaceholder">
              <span class="heart-icon">♡</span>
              <h2>Ready for a photo?</h2>
              <p>Turn on your camera to begin</p>
            </div>

            <div class="camera-overlay"></div>
            <div class="countdown" id="countdown"></div>
            <div class="flash" id="flash"></div>
          </div>

        </div>
      </div>
    </section>

    <div class="analog-meter">
      <div class="meter-face">
        <div class="meter-ticks">
          <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span>
        </div>
        <div class="meter-needle"></div>
        <div class="meter-center"></div>
        <div class="battery"><span></span></div>
      </div>
    </div>

    <section class="preview-section">
      <div class="preview-frame">
        <div class="preview-inner">
          <div class="preview-screen">

            <div class="photo-paper" id="photoPaper">
              <div class="empty-preview" id="emptyPreview">
                <span>♡</span>
                <h3>Your Little Memories</h3>
                <p>Your four photos will appear here</p>
              </div>

              <canvas id="photoCanvas" width="700" height="900" hidden></canvas>
            </div>

          </div>
        </div>
      </div>
    </section>

  </main>

  <section class="bottom-controls">

    <button class="machine-button" id="flipCamera">
      <span class="button-icon">↻</span>
      <span>LẬT<br>CAMERA</span>
    </button>

    <button class="machine-button capture-button" id="capture">
      <span class="button-icon">✦</span>
      <span>CHỤP 4 TẤM<br>LIÊN TIẾP</span>
    </button>

    <button class="machine-button" id="review">
      <span class="button-icon">▧</span>
      <span>XEM LẠI<br>DẢI ẢNH</span>
    </button>

  </section>

  <div class="extra-controls">
    <button id="startCamera" class="small-control">◉ BẬT CAMERA</button>
    <button id="download" class="small-control" disabled>↓ LƯU ẢNH</button>
    <button id="retake" class="small-control" disabled>↺ CHỤP LẠI</button>
  </div>

  <div class="personal-note">
    <input
      id="customNote"
      type="text"
      maxlength="36"
      value="For my favorite person♥"
      placeholder="Viết lời nhắn của bạn..."
    >
  </div>

  <footer class="footer">
    <span>MADE WITH LOVE ♡</span>
    <span>OUR LITTLE MEMORY MACHINE · 001</span>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
